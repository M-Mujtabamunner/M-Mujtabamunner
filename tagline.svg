<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="105" viewBox="0 0 1000 105">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="28%" stop-color="#172554"/>
        <stop offset="58%" stop-color="#6d28d9"/>
        <stop offset="82%" stop-color="#0891b2"/>
        <stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee"/>
        <stop offset="45%" stop-color="#3b82f6"/>
        <stop offset="72%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
<rect x="4" y="4" width="992" height="97" rx="24" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
<text x="500" y="63" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Designing Ideas. Building Experiences.</text>
</svg>