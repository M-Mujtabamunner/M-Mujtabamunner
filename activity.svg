<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="28%" stop-color="#172554"/>
        <stop offset="58%" stop-color="#6d28d9"/>
        <stop offset="82%" stop-color="#0891b2"/>
        <stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee"/>
        <stop offset="45%" stop-color="#3b82f6"/>
        <stop offset="72%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
<rect x="3" y="3" width="754" height="264" rx="24" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
<text x="42" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">GitHub Profile Snapshot</text>
<text x="42" y="88" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Local card — no external statistics API required</text>

<rect x="42" y="120" width="205" height="105" rx="18" fill="#111c35"/>
<text x="144" y="164" text-anchor="middle" fill="#22d3ee" font-family="Arial, sans-serif" font-size="38" font-weight="700">15</text>
<text x="144" y="198" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">Public Repositories</text>

<rect x="277" y="120" width="205" height="105" rx="18" fill="#111c35"/>
<text x="379" y="164" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="38" font-weight="700">2</text>
<text x="379" y="198" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">Profile Stars</text>

<rect x="512" y="120" width="205" height="105" rx="18" fill="#111c35"/>
<text x="614" y="162" text-anchor="middle" fill="#f472b6" font-family="Arial, sans-serif" font-size="29" font-weight="700">2026</text>
<text x="614" y="198" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">Recently Active</text>
</svg>